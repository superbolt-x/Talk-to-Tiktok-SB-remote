[project]
name = "talk-to-tiktok-mcp"
version = "1.0.0"
description = "Talk-to-TikTok MCP — remote TikTok Ads server for Claude custom connectors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
    "six>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
talk-to-tiktok-mcp = "tiktok_ads_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktok_ads_mcp*"]
